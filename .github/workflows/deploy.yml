# Deploy static export to Cloudflare Pages on push to main.
# Repo secrets (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN — Pages Edit (+ Account read)
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare dashboard → right sidebar

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=eurodigital-ca --branch=main
