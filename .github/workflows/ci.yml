name: CI

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, lint, typecheck, test, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact npm version
        run: npm install --global npm@10.9.2

      - name: Verify runtime pins
        run: |
          expected_node="v$(tr -d '\r\n' < .nvmrc)"
          expected_npm="$(node -p "require('./package.json').engines.npm")"
          test "$(node --version)" = "$expected_node"
          test "$(npm --version)" = "$expected_npm"
          test "$(node -p "require('./package.json').packageManager")" = "npm@$expected_npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: |
          set +e
          npm run lint > lint.log 2>&1
          status=$?
          cat lint.log
          exit "$status"

      - name: Upload lint diagnostics
        if: ${{ failure() && steps.lint.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-diagnostics-${{ github.sha }}
          path: lint.log
          retention-days: 1
          if-no-files-found: error

      - name: Typecheck
        run: npm run typecheck

      - name: Test contact function
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Verify static export artifacts
        run: node scripts/verify-static-export.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
