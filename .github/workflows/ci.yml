name: CI

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, lint, typecheck, test, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact npm version
        run: npm install --global npm@10.9.2

      - name: Verify runtime pins
        run: |
          expected_node="v$(tr -d '\r\n' < .nvmrc)"
          expected_npm="$(node -p "require('./package.json').engines.npm")"
          test "$(node --version)" = "$expected_node"
          test "$(npm --version)" = "$expected_npm"
          test "$(node -p "require('./package.json').packageManager")" = "npm@$expected_npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test contact function
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Verify native Web Analytics static output
        env:
          REQUIRE_STATIC_EXPORT: "1"
        run: node --test test/native-web-analytics.test.mjs

      - name: Verify revenue engine static output
        env:
          REQUIRE_STATIC_EXPORT: "1"
        run: node --test test/revenue-engine.test.mjs

      - name: Verify static export artifacts
        run: node scripts/verify-static-export.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
